<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla callback</title>
<style>body{font-family:sans-serif;padding:20px}code{display:block;word-break:break-all;background:#eee;padding:10px;margin:6px 0}button{font-size:18px;padding:8px 16px}</style></head>
<body><h2>Tesla authorization</h2><p>code:</p><code id="c"></code><button onclick="cp('c')">Copy code</button><p>state:</p><code id="s"></code><button onclick="cp('s')">Copy state</button>
<script>const q=new URLSearchParams(location.search);c.textContent=q.get('code')||'(none)';s.textContent=q.get('state')||'(none)';
function cp(i){navigator.clipboard.writeText(document.getElementById(i).textContent)}</script></body></html>
